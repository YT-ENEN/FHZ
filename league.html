  <title>BNT 上帝賽事資料查詢</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&family=Roboto&family=Orbitron:wght@400;700&display=swap");

    html, body {
      background-image: url("PNG/bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #0c182a;
      font-family: 'GFF Latin', 'cwTeXYen', 'Noto Sans TC', sans-serif;
      color: #ffffff;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }
    /* 修正：為主要內容區塊增加上邊距，避免被固定導覽列遮擋 */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 100px; /* 騰出空間 */
    }
    .container_1 {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .photos {
      max-width: 100%;
      max-height: 100%;
    }
    .photos img {
      width: 100%;
      height: auto;
      border: 3px solid #00c7e2;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 199, 226, 0.7);
    }
    .index {
      max-width: 100%;
      max-height:100%;
    }
    .index img {
      width: 100%;
      height: auto;
    }
    .Text {
      color: #00c7e2;
      font-size: 26px;
      height: 84px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 199, 226, 0.5);
    }
    .Footer {
      display: flex;
      color: #ffffff;
      font-family: 'GFF Latin', 'cwTeXYen',"Noto Sans TC";
      font-weight: 300;
      font-size: 16px;
      text-align: center;
      background-color: #0b151f;
      justify-content: center;
      align-items: center;
      padding-top: 13px;
      letter-spacing: 1px;
    }
    /* 導覽列 */   
    nav {
      height:70px;
    }
    .navbar {
      background-color: rgba(12, 24, 42, 0.8);
      position: fixed;
      top: 0;
      width: 100%;
      transition: top 0.3s;
      backdrop-filter: blur(5px);
    }
    /* 提高權重以覆蓋 Bootstrap 的預設顏色，確保為藍綠色 */
    .navbar-nav .nav-item .nav-link { 
      display: block;
      padding: 10px;
      font-size: 20px;
      color: #00c7e2; /* 藍綠色 */
      text-align: center;
      font-family: 'GFF Latin', 'cwTeXYen','Orbitron', sans-serif;
      font-weight: 700;
      text-decoration: none; 
      padding:20px; /* 沿用原本 nav-link 的 padding */
    }
    li a {
      display: block;
      padding: 10px;
      font-size: 20px;
      color: #00c7e2;
      text-align: center;
      font-family: 'GFF Latin', 'cwTeXYen','Orbitron', sans-serif;
      font-weight: 700;
      text-decoration: none;   
    }
    li a:hover {
      color: #ffffff;
      background-color: #00c7e2;
      box-shadow: 0 0 15px rgba(0, 199, 226, 0.5);
    }
    /* 修正導覽列按鈕樣式，確保圖示可見 */
    .navbar-toggler {
      background-color: transparent;
      border: 1px solid #00c7e2;
    }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3e%3cpath stroke='rgba%280, 199, 226, 1%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
    }
    .nav-link {
      padding:20px;
    }
    .logo {
      height: 50px;
    }
    @media (max-width:1000px){
      nav {
        height:auto;
      }
      .nav-link {
        padding:10px;
      }
      .logo {
        height:50px;
      }
    }
    /* 新增區塊樣式 */
    .content-section {
      background-color: rgba(12, 24, 42, 0.7);
      backdrop-filter: blur(5px);
      padding: 40px 20px;
      margin-top: 50px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 199, 226, 0.3);
      text-align: center;
      max-width: 3000px;
      width: 100%;
    }
    .section-title {
      color: #f8dd00;
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(248, 221, 0, 0.7);
    }
    .line-button {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 30px;
      background-color: #00c7e2;
      color: #0c182a;
      text-decoration: none;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.2em;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 199, 226, 0.7);
    }
    .line-button:hover {
      background-color: #f8dd00;
      color: #0c182a;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(248, 221, 0, 0.9);
    }
    /* 賽事表格樣式 */
    #match-schedule {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-family: 'GFF Latin', 'cwTeXYen','Noto Sans TC', sans-serif;
      text-align: left;
      color: #e0e0e0;
      font-weight: 600;
    }
    #match-schedule th, #match-schedule td {
      border: 1px solid #1f364d;
      padding: 12px 15px;
    }
    #match-schedule th {
      background-color: #122131;
      color: #f8dd00;
      font-weight: bold;
      text-transform: uppercase;
    }
    #match-schedule tr:nth-child(even) {
      background-color: #0c182a;
    }
    #match-schedule tr:hover {
      background-color: #1a2a40;
      color: #00c7e2;
    }
    .iframe-container {
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      border: 3px solid #ddd;
      margin-bottom: 10px;
    }

    .iframe-container iframe {
      width: 100%;
      height: 700px; /* 手動設置高度 */
      border: none;
    }

    .record {
      max-width: 100%;
      margin: 20px 0;
    }

    .text-box {
      margin: 0px auto;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      font-family: 'GFF Latin', 'MS PGothic', Calibri, 'Trebuchet MS', sans-serif;
      border-radius: 5px;
      text-align: center;
      max-width: 800px;
      font-size: 1rem;
    }

    .warnbox {
      background-color: #3a3a3a;
      padding: 20px;
      text-align: center;
    }

    .warnbox button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: #C09AD9;
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .warnbox button:hover {
      background-color: #7E84C6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-family: 'GFF Latin', 'MS PGothic', Calibri, 'Trebuchet MS', sans-serif;
    }

    table, th, td {
      border: 2px solid #ddd;
    }

    th, td {
      padding: 10px;
      text-align: center;
      color: #ffffff;
    }

    th {
      background-color: #606060;
    }
  </style>
